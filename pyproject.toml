[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Készítette Péter Noé
name = "pulse-system-monitor"
version = "0.1.0"
description = "A desktop system monitor for Windows and Linux"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9", "PySide6-Essentials>=6.7,<7"]

[project.gui-scripts]
pulse = "pulse.app:main"

[tool.setuptools.packages.find]
where = ["src"]
